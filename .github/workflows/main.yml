name: Deploy via FTP

on:
  push:
    branches:
      - main # Ganti dengan 'master' jika Anda masih menggunakan branch master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files to hosting
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        # server: ${{ secrets.FTP_SERVER }}
        server: 185.27.134.11
        username: thsi_42800340
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        security: loose # <--- TAMBAHKAN BARIS INI untuk mematikan enkripsi TLS ketat
        # server-dir: ./ 
        # (Biarkan ./ jika akun FTP Anda sudah langsung mengarah ke public_html)
        server-dir: ./htdocs/
