name: Build and Deploy Playlist
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - edit.py
      - .github/workflows/deploy.yml

permissions:
  contents: write

concurrency:
  group: playlist-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Ambil sumber playlist
        run: |
          curl -fsSL https://raw.githubusercontent.com/dhasap/dhanytv/main/dhanytv.m3u -o dhanytv.m3u
          curl -fsSL "https://raw.githubusercontent.com/garissudut90/Shareext-LokalHiburan.m3u/refs/heads/main/Shareext%40LokalHiburan.m3u" -o update-script/extra1.m3u || echo "extra1 gagal diunduh, dilewati"

      - name: Build playlist
        run: |
          python3 update-script/edit.py dhanytv.m3u playlist.m3u
          test "$(grep -c '^#EXTINF' playlist.m3u)" -gt 100

      - name: Siapkan folder deploy (hanya playlist.m3u)
        run: |
          mkdir -p dist
          cp playlist.m3u dist/playlist.m3u

      - name: Simpan playlist.m3u ke repo
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add playlist.m3u
          git diff --staged --quiet || (git commit -m "build playlist" && git push)

      - name: Deploy playlist.m3u ke hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ./htdocs/iptv/
